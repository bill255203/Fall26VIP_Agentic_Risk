name: Cohort goal (maintainer)
description: Coordinate shared support or collect pair/student outputs without duplicate tasks
title: "[Individual assignment] Outcome"
labels: [group-goal]
body:
  - type: markdown
    attributes:
      value: |
        Title this guide [Individual assignment] or [Pair assignment] according to who produces the deliverable; use [Resource] for optional shared help/examples. Add the matching individual-assignment or pair-assignment label for assignment guides, and optional when applicable. These guides serve the whole class; students keep personal evidence in Individual tasks and shared outputs in Pair cases. Check the [complete task map](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/issue-workflow.md#complete-task-and-assessment-map) before adding another Cohort goal. Pairs use the Pair case form; this form is only for shared support or cohort output collection. Students use Individual tasks for personal work. The cohort assignee is a coordinator; each student owns a separate task. See the [issue guide](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/issue-workflow.md).
  - type: textarea
    id: objective
    attributes:
      label: Shared outcome and participation
      description: Lead with who does the work, the next actions, where to submit evidence, and when it is done. Distinguish each student's assignment from each pair's shared output; give a working target or mark it optional.
    validations:
      required: true
  - type: input
    id: coordinator
    attributes:
      label: Coordinator
      description: At most one confirmed coordinator, or unassigned. This role does not own every contributor's work.
  - type: textarea
    id: dependencies
    attributes:
      label: Milestone, dependencies, and target
      description: Link prerequisites and the semester plan. The maintainer sets workstream labels and milestone; conditional or stretch work stays deferred until adopted.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Cohort completion criteria
      description: Define required pair/participant coverage and where to inspect it. For pair outputs, use the #3 registry and Pair case checkpoints. State the applicable assessment component or that there is no separate grade. One contribution does not close a cohort collection.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Pair cases, output links, or Individual tasks
      description: For pair outputs, link the #3 registry or existing Pair case; keep artifact links in that case. For a shared assignment, link personal tasks and owners. Reuse existing records; do not invent assignments or duplicate output lists.
