name: Pair case
description: Register one pair's business case and keep its semester outputs together
title: "[Pair] CASE-SLUG — business workflow and risk question"
labels: [pair-case, research]
body:
  - type: markdown
    attributes:
      value: |
        Partners agree one case and link it in #3. Each student opens their own Individual tasks under it. Start small and refine with peer feedback; no instructor sign-off or appointed mentor is required. The instructor may adapt scope, pairings and timing. Use the [case guide](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/studies/README.md). No platform or paid access is assumed.
  - type: input
    id: partners
    attributes:
      label: Partners and peer feedback
      description: Name both GitHub usernames. Add peer reviewers when arranged; an unassigned reviewer does not block starting.
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Short case outline
      description: Half a page is enough. Choose one relevant risk question; propagation is optional, alongside reliability, permissions, oversight, security/privacy and observability. Link your case document when available rather than maintaining two copies.
      value: |
        - Business workflow and source:
        - One risk question / possible improvement:
        - Relevant prior work:
        - Evidence and comparison:
        - Feasibility, help needed, and next individual roles:
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Individual tasks and roles
      description: Link each student's own tasks as agreed. Keep completed and open links; a shared artifact must say who did what.
  - type: textarea
    id: checkpoints
    attributes:
      label: Working checkpoints
      description: Adapt targets and activities to course direction and progress; note changes here. Use M5 for this semester-long issue. This is not an approval checklist.
      value: |
        - [ ] M2 Oct 9 — partners, short outline, accessible evidence route and next tasks recorded
        - [ ] M3 Oct 16 — midterm slides/feedback linked (#21); dated method and feasibility check linked (#7)
        - [ ] During evidence work — evaluation rules recorded before use; exploratory work and later changes identified
        - [ ] M4 Oct 30 — first checked analysis, failures and limitations linked (#8)
        - [ ] Nov 6 — pair report draft and both individual report drafts linked
        - [ ] M5 Nov 20 — reviewed report/evidence and peer handoff check linked (#9)
        - [ ] M5 Nov 20 — final presentation and feedback linked (#22)
        - [ ] M5 Nov 20 — each student's individual report task linked (#23)
        - [ ] Both partners' contributions reviewed; report index updated; remaining work recorded
  - type: textarea
    id: evidence
    attributes:
      label: Method, evidence, feedback, and changes
      description: Link the dated working method and available peer feedback. Record what changed, why, and whether results had been inspected. Routine refinements need no instructor sign-off.
