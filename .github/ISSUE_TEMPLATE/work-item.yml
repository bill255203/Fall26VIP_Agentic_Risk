name: Individual task
description: One student's contribution under a Pair case or shared cohort goal
title: "[Individual] YOUR-USERNAME — outcome"
labels: [individual-task]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for your own contribution. One task has one student owner. Multiple students may attempt the same assignment separately; joint work names each person's part. Use your Pair case as parent for research; onboarding uses #5, optional starter practice #1, individual report #23. Link the new task in its parent; a comment is enough. Reuse an existing task when it already covers this work. See [where tasks belong](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/issue-workflow.md#where-does-my-task-belong).
  - type: input
    id: parent
    attributes:
      label: Primary parent issue
      description: Enter the issue number of your Pair case or the common assignment. This field is a link, not a special GitHub setup step.
      placeholder: "#YOUR-PAIR-CASE (or #5, #1, #23 for common assignments)"
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Student owner
      description: One GitHub username. Name collaborators below; a maintainer can set the assignee field.
      placeholder: "@YOUR-USERNAME"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Work mode
      description: Choose shared work when contributing to a pair output; choose independent attempt for your own onboarding, optional starter, report or agreed replication.
      options:
        - Contribution to shared work
        - Independent attempt at a shared assignment
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: My deliverable
      description: State your own output and why it helps. For joint work, distinguish your part and link your partner's task. If spanning assessment categories, identify a distinct output for each; one output is not counted twice within individual work.
      placeholder: "I will map the refund workflow from two public sources and identify one consequential agent error. My partner will check the map against the sources."
    validations:
      required: true
  - type: dropdown
    id: assessment
    attributes:
      label: Assessment category
      description: Foundation = reading/critique; Question = design; Execution = implement/collect/check; Synthesis = interpret/report findings. The remaining options cover review, your personal report and onboarding. Weights apply across the semester, not per issue.
      options:
        - Foundation
        - Question
        - Execution
        - Synthesis
        - Collaboration / review
        - Individual contribution report
        - Onboarding / administration — no separate grade
        - Multiple categories — distinct outputs explained in My deliverable
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone or backlog status
      description: Choose the next working checkpoint, or optional practice without a required milestone; a maintainer sets the field and optional label. Reuse tasks across weeks and adjust the target as work or course direction changes.
      options:
        - M1 — Onboard and understand
        - M2 — Propose pair cases
        - M3 — Present cases and validate plans
        - M4 — Analyze first evidence
        - M5 — Report and hand off
        - Optional practice — no required milestone
        - Candidate / stretch — not adopted, no delivery milestone
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Working target and peer check
      description: State a date or next check-in. Add a peer reviewer when arranged; no instructor approval or appointed mentor is needed to start. Note blockers here.
      placeholder: "Next check-in: Oct 9; peer check: to be arranged."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Two or three observable checks for your contribution. For a common assignment, use its issue instructions; for research, agree them with your partner. Arrange a peer check as work develops.
      placeholder: |
        - [ ] Artifact/source/analysis linked
        - [ ] Result or diagnosed limitation explained and checked
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, collaborators, and help needed
      description: Link sources, commands/config/data, artifacts/PRs and review as applicable. State collaborators' actual roles and material tool assistance. Use existing weekly updates for evidence, next step and blocker. Say when you need help or the evidence is ready for review; a maintainer can set the attention label. No private data or grades.
