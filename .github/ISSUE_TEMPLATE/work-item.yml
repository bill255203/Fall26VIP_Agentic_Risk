name: Individual task
description: One student's own attempt or contribution under a Group goal
title: "[Individual] YOUR-USERNAME — outcome"
labels: [individual-task]
body:
  - type: markdown
    attributes:
      value: |
        Two students doing the same assignment independently open two Individual tasks under the same Group goal. One task has one student owner. Read the [issue guide](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/issue-workflow.md).
        Onboarding also uses an Individual task under #5. Link your introduction PR; no research result is required. Find the parent for every deliverable in the [task map](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/issue-workflow.md#complete-task-and-assessment-map).
  - type: input
    id: parent
    attributes:
      label: Parent Group goal
      description: Link the existing goal. A maintainer links your task from its Individual tasks section.
      placeholder: "#1"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Work mode
      options:
        - Independent attempt at a shared assignment
        - Contribution to shared work
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone or backlog status
      description: A maintainer also sets the GitHub milestone field. Changes to scope need a plan update.
      options:
        - M1 — Onboard and reproduce
        - M2 — Select a question and freeze protocol
        - M3 — Implement and validate
        - M4 — Run and analyze
        - M5 — Report and hand off
        - Candidate — pending study selection, no delivery milestone yet
        - Stretch backlog — no delivery milestone yet
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Research
        - Engineering
        - Experiment
        - Bug
        - Documentation / onboarding
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State what you personally will produce or investigate and its agreed stage (Foundation, Question, Execution, or Synthesis). For onboarding, a contribution report, or a collaboration-only task, name that component instead. If work spans stages, identify distinct outputs. For joint work, name your part and link collaborators' tasks.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Research value
      description: Explain how this informs question selection or supports the selected study. A sourced critique, reproduction attempt, or rejected proposal can be a useful outcome. For onboarding, state that the task establishes access and visible attribution.
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Student owner
      description: One GitHub username. A maintainer confirms scope and sets this person as the sole assignee before work begins.
      placeholder: "@YOUR-USERNAME"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target or check-in
      description: Propose a date or checkpoint for confirmation with the maintainer.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Proposed reviewer
      description: Name someone other than yourself, or write awaiting assignment. A maintainer confirms the reviewer.
  - type: textarea
    id: dependencies
    attributes:
      label: Collaborators, dependencies, and scope
      description: Name helpers and their actual roles; link related tasks and prerequisites. State whether work is required, conditional, or optional. Disclose shared work rather than calling it independent.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that make your own work complete and reviewable. A recorded blocked attempt may need revised criteria agreed with the maintainer.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproducibility record
      description: For exploration, link sources, critique, and feasibility evidence. For experiments or data analysis, list the intended data/config, provenance, comparison, measures, and analysis.
