name: Individual task
description: One student's contribution under a Pair case or shared cohort goal
title: "[Individual] YOUR-USERNAME — outcome"
labels: [individual-task]
body:
  - type: markdown
    attributes:
      value: |
        One task has one student owner. Multiple students may independently attempt the same agreed assignment with separate evidence; joint work states each person's part. Use your Pair case as parent for research; onboarding uses #5, starter #1, individual report #23. See the [task map](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/issue-workflow.md#complete-task-and-assessment-map). No issue-count quota or duplicate portfolio.
  - type: input
    id: parent
    attributes:
      label: Primary parent issue
      description: Link your Pair case or the relevant shared goal. Related goals can link this task without a duplicate.
      placeholder: "#YOUR-PAIR-CASE (or #5, #1, #23 for common assignments)"
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Student owner
      description: One GitHub username. Name collaborators below; a maintainer can set the assignee field.
      placeholder: "@YOUR-USERNAME"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Work mode
      options:
        - Contribution to shared work
        - Independent attempt at a shared assignment
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: My deliverable and stage
      description: State your own output and why it helps. Name Foundation, Question, Execution, Synthesis, or onboarding/report/collaboration. For joint work, distinguish your part and link your partner's task. If spanning stages, identify distinct outputs.
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone or backlog status
      description: Choose the next output checkpoint; a maintainer sets the actual field. Reuse tasks across weeks.
      options:
        - M1 — Onboard and understand
        - M2 — Propose pair cases
        - M3 — Present cases and validate plans
        - M4 — Analyze first evidence
        - M5 — Report and hand off
        - Candidate / stretch — not adopted, no delivery milestone
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target and reviewer
      description: Agreed date or next check-in; reviewer other than yourself, or awaiting assignment. Raise setup blockers immediately.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Two or three observable checks for your contribution. Scope and support are agreed with the reviewer.
      placeholder: |
        - [ ] Artifact/source/analysis linked
        - [ ] Result or diagnosed limitation explained and checked
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, collaborators, and help needed
      description: Link sources, commands/config/data, artifacts/PRs and review as applicable. State collaborators' actual roles and material tool assistance. Weekly updates can be comments with evidence, next step and blocker. No private data or grades.
